<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{{Subject}}</title>
</head>
<body style="margin:0;padding:0;background:#F9FAFC;font-family:'Segoe UI',Arial,sans-serif;color:#333333;">
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="background:#F9FAFC;">
    <tr>
      <td align="center" style="padding:24px 12px;">
        <table role="presentation" width="600" cellspacing="0" cellpadding="0" border="0" style="width:100%;max-width:600px;background:#ffffff;border:1px solid #d9dfe5;">
          <tr><td style="height:7px;background:{{PrimaryColor}};font-size:0;line-height:0;">&nbsp;</td></tr>
          <tr>
            <td align="center" style="padding:28px 32px 24px;border-bottom:1px solid #e6e9ed;">
              <img src="cid:studio-logo" width="210" alt="{{OfficeName}}" style="display:block;width:210px;max-width:100%;height:auto;border:0;">
            </td>
          </tr>
          <tr>
            <td style="padding:30px 34px 34px;">
              <div style="margin:0 0 8px;color:{{PrimaryColor}};font-size:13px;font-weight:600;letter-spacing:1.4px;">{{ProductLabel}}</div>
              <div style="width:46px;height:3px;margin:0 0 26px;background:{{InstitutionalAccent}};font-size:0;line-height:0;">&nbsp;</div>
              <p style="margin:0 0 14px;font-size:16px;line-height:25px;color:#333333;">{{Introduction}}</p>
              <p style="margin:0 0 22px;font-size:22px;line-height:30px;font-weight:600;color:{{PrimaryDarkColor}};">{{Condivisione}}</p>
              {{CustomMessageBlock}}
              <table role="presentation" align="center" cellspacing="0" cellpadding="0" border="0" style="margin:26px auto;">
                <tr>
                  <td bgcolor="{{PrimaryColor}}" style="background:{{PrimaryColor}};">
                    <a href="{{LinkCondivisione}}" style="display:inline-block;padding:14px 24px;color:#ffffff;text-decoration:none;font-size:14px;font-weight:600;">{{ButtonText}}</a>
                  </td>
                </tr>
              </table>
              <p style="margin:0;font-size:13px;line-height:20px;color:#555555;">{{AccessNotice}}</p>
              {{ConfidentialityBlock}}
            </td>
          </tr>
          <tr>
            <td style="padding:0;background:#f3f4f6;border-top:1px solid #e1e4e8;">
              <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0">
                <tr>
                  <td width="64%" valign="top" style="padding:20px 12px 20px 34px;background:#f3f4f6;">
                    <p style="margin:0 0 5px;color:{{PrimaryColor}};font-size:12px;font-weight:600;letter-spacing:.6px;">{{OfficeTitle}}</p>
                    <p style="margin:0 0 18px;font-size:12px;line-height:18px;color:#444444;">{{OfficeAddress}}<br>{{OfficePhone}}</p>
                    <p style="margin:0 0 5px;font-size:11px;line-height:17px;color:#555555;">{{SupportText}}</p>
                    <p style="margin:0;font-size:12px;line-height:18px;"><a href="mailto:{{SupportAddress}}" style="color:{{PrimaryColor}};">{{SupportAddress}}</a></p>
                  </td>
                  <td width="36%" align="right" valign="bottom" style="padding:14px 0 0 0;background:#f3f4f6;">
                    <img src="cid:building-watermark" width="172" height="166" alt="" role="presentation" aria-hidden="true" draggable="false" style="display:block;width:172px;max-width:100%;height:166px;border:0;outline:none;text-decoration:none;pointer-events:none;">
                  </td>
                </tr>
              </table>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
